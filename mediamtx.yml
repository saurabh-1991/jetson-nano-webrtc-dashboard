# Optional MediaMTX gateway profile for production-style stream routing.
#
# Default paths:
# - Publish RTSP to: rtsp://<host>:8554/cam1 or rtsp://<host>:8554/cam2
# - Read WebRTC (WHEP): http://<host>:8889/cam1/whep and /cam2/whep
#
# Keep this intentionally minimal and safe; expand with TURN/STUN and auth per deployment.

logLevel: info

rtspAddress: :8554
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189

api: yes
apiAddress: :9997

paths:
  cam1: {}
  cam2: {}
