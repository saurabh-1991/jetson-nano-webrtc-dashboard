version: '3.3'

services:
  # Jetson Nano Backend
  jetson-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.jetpack46
    container_name: jetson-nano-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - API_DEBUG=False
      - LOG_LEVEL=INFO
      - CAMERA_SOURCE=usb
      - CAMERA_ENABLED_IDS=cam1,cam2
      - CAMERA_ACCELERATION=auto
      - CAMERA_USB_STARTUP_PROBE=true
      - CAMERA1_FPS=20
      - CAMERA2_FPS=15
      - CAMERA_BUFFER_FLUSH_GRABS=1
      - CAMERA_SHARED_FRAME_PRODUCER_ENABLED=true
      - CAMERA_SHARED_FRAME_PRODUCER_IDLE_SECONDS=6
      - CAMERA_SHARED_FRAME_WAIT_MS=260
      - CAMERA1_AUTO_BRIGHTNESS=true
      - CAMERA2_AUTO_BRIGHTNESS=true
      - EXPERIMENTS_VIDEO_USE_SHARED_FRAME_CACHE=true
      - EXPERIMENTS_VIDEO_SHARED_MEMORY_STRICT=true
      - EXPERIMENTS_VIDEO_CACHE_MAX_AGE_SECONDS=0.45
      - EXPERIMENTS_VIDEO_DIRECT_PULL_INTERVAL_SECONDS=0.9
      - CUDA_ENABLED=true
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    volumes:
      - /dev:/dev
      - /mnt/usb_recordings:/mnt/usb_recordings
      - ./backend:/app
      - ./.git:/workspace/.git:ro
    privileged: true
    restart: unless-stopped
    networks:
      - jetson-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend
  jetson-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jetson-nano-frontend
    ports:
      - "80:80"
    depends_on:
      - jetson-backend
    restart: unless-stopped
    networks:
      - jetson-network

  # Auto-prunes dangling images/build-cache to prevent disk growth from repeated --build runs.
  docker-prune:
    image: docker:cli
    container_name: jetson-docker-prune
    command: >
      sh -c '
        INTERVAL="$${AUTO_PRUNE_INTERVAL_SECONDS:-3600}";
        echo "[docker-prune] Started. Interval=$${INTERVAL}s";
        while true; do
          echo "[docker-prune] Running prune at $$(date -Iseconds)";
          docker image prune -f;
          docker builder prune -f;
          sleep "$${INTERVAL}";
        done
      '
    environment:
      - AUTO_PRUNE_INTERVAL_SECONDS=3600
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

networks:
  jetson-network:
    driver: bridge
