version: '3.3'

services:
  # Jetson Nano Backend
  jetson-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.jetpack46
      args:
        BASE_IMAGE: ${BACKEND_BASE_IMAGE:-jetson-backend-base:jp46-opencv455-v1}
    container_name: jetson-nano-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - API_DEBUG=False
      - LOG_LEVEL=INFO
      - CAMERA_SOURCE=usb
      - CAMERA_ENABLED_IDS=cam1,cam2
      - CAMERA_ACCELERATION=auto
      - CAMERA_USB_STARTUP_PROBE=true
      - CAMERA1_FPS=20
      - CAMERA2_FPS=15
      - CAMERA_BUFFER_FLUSH_GRABS=5
      - CAMERA1_AUTO_BRIGHTNESS=true
      - CAMERA2_AUTO_BRIGHTNESS=true
      - CUDA_ENABLED=true
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - MEDIA_WEBRTC_GATEWAY_ENABLED
      - MEDIA_WEBRTC_GATEWAY_WHEP_TEMPLATE
      - MEDIA_WEBRTC_GATEWAY_CAM1_WHEP_URL
      - MEDIA_WEBRTC_GATEWAY_CAM2_WHEP_URL
      - VFD_ENABLED=true
      - VFD_HOST=192.168.0.201
      - VFD_PORT=502
      - VFD_SLAVE_ID=1
      - VFD_TIMEOUT_SECONDS=1.0
      - VFD_MIN_SPEED_HZ=0.0
      - VFD_MAX_SPEED_HZ=50.0
      - VFD_DEFAULT_SPEED_HZ=0.0
      - VFD_SPEED_SCALE=100
      - VFD_ADDRESS_BASE=0
      - VFD_ADDRESS_OFFSET=0
      - VFD_RUN_COMMAND_REGISTER=8192
      - VFD_SPEED_COMMAND_REGISTER=8193
      - VFD_RUN_FORWARD_WORD=18
      - VFD_STOP_WORD=1
      - VFD_MIN_WRITE_INTERVAL_MS=150
      - VFD2_ENABLED=true
      - VFD2_HOST=192.168.0.202
      - VFD2_PORT=502
      - VFD2_SLAVE_ID=1
      - VFD2_TIMEOUT_SECONDS=1.0
      - VFD2_MIN_SPEED_HZ=0.0
      - VFD2_MAX_SPEED_HZ=50.0
      - VFD2_DEFAULT_SPEED_HZ=0.0
      - VFD2_SPEED_SCALE=100
      - VFD2_ADDRESS_BASE=0
      - VFD2_ADDRESS_OFFSET=0
      - VFD2_RUN_COMMAND_REGISTER=8192
      - VFD2_SPEED_COMMAND_REGISTER=8193
      - VFD2_RUN_FORWARD_WORD=18
      - VFD2_STOP_WORD=1
      - VFD2_MIN_WRITE_INTERVAL_MS=150
      - MODBUS_ENABLED=true
      - MODBUS_TRANSPORT=tcp
      - MODBUS_PORT=/dev/ttyUSB0
      - MODBUS_HOST=192.168.0.204
      - MODBUS_TCP_PORT=502
      - MODBUS_SLAVE_ID=1
      - MODBUS_BAUDRATE=9600
      - MODBUS_BYTESIZE=8
      - MODBUS_PARITY=N
      - MODBUS_STOPBITS=1
      - MODBUS_TIMEOUT=0.8
      - MODBUS_REGISTER_TYPE=holding
      - MODBUS_ADDRESS_BASE=0
      - MODBUS_ADDRESS_OFFSET=0
      - FLOW_METER_ENABLED=true
      - FLOW_METER_TRANSPORT=tcp
      - FLOW_METER_HOST=192.168.0.203
      - FLOW_METER_TCP_PORT=502
      - FLOW_METER_SLAVE_ID=1
      - FLOW_METER_TIMEOUT=0.8
      - FLOW_METER_REGISTER_TYPE=holding
      - FLOW_METER_ADDRESS_BASE=0
      - FLOW_METER_ADDRESS_OFFSET=0
      - FLOW_METER_VALUE_ADDRESS=0
      - FLOW_METER_DECIMAL_ADDRESS=
      - FLOW_METER_STATUS_ADDRESS=
      - FLOW_METER_SCALE=0.1
      - FLOW_METER_OFFSET=0.0
      - FLOW_METER_SIGNED=false
      - FLOW_METER_MIN_VALUE=0.0
      - FLOW_METER_MAX_VALUE=99999.0
      - FLOW_METER_FAILURE_BACKOFF_SECONDS=5.0
      - GPIO_FLAME_INPUT_PIN=22
      - GPIO_FLAME_ACTIVE_LOW=true
    volumes:
      - /dev:/dev
      - /mnt/usb_recordings:/mnt/usb_recordings
      - ./backend:/app
      - ./.git:/workspace/.git:ro
    privileged: true
    restart: unless-stopped
    networks:
      - jetson-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend
  jetson-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jetson-nano-frontend
    ports:
      - "80:80"
    depends_on:
      - jetson-backend
    restart: unless-stopped
    networks:
      - jetson-network

  # Auto-prunes dangling images/build-cache to prevent disk growth from repeated --build runs.
  docker-prune:
    image: docker:cli
    container_name: jetson-docker-prune
    command: >
      sh -c '
        INTERVAL="$${AUTO_PRUNE_INTERVAL_SECONDS:-3600}";
        echo "[docker-prune] Started. Interval=$${INTERVAL}s";
        while true; do
          echo "[docker-prune] Running prune at $$(date -Iseconds)";
          docker image prune -f;
          docker builder prune -f;
          sleep "$${INTERVAL}";
        done
      '
    environment:
      - AUTO_PRUNE_INTERVAL_SECONDS=3600
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

networks:
  jetson-network:
    driver: bridge
